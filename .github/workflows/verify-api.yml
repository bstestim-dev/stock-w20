# M2 API 實測驗證（2026-11-25 裁定 (c)）：僅限手動觸發，不含 schedule，不使用任何 Secrets。
# M4 起增加 mode=m4_dry_run：以真實 60 週資料試跑選股引擎（不部署 Pages、不寫入 site/）。
name: verify-api

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "api＝API 實測（M2～M3）；m4_dry_run＝M4 選股引擎全量試跑（約 30～60 分鐘，上限 120 分鐘）"
        required: false
        default: "api"
        type: choice
        options: ["api", "m4_dry_run"]
      as_of_date:
        description: "m4_dry_run 用：基準日 YYYY-MM-DD（空白＝今日，Asia/Taipei）"
        required: false
        default: ""
      sample_date:
        description: "樣本交易日 YYYY-MM-DD（Asia/Taipei）"
        required: false
        default: "2026-11-20"
      window_end:
        description: "短窗歷史測試終點 YYYY-MM-DD（往前約 3 週）"
        required: false
        default: "2026-10-09"

permissions:
  contents: read

jobs:
  verify:
    if: ${{ inputs.mode != 'm4_dry_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
      # 以環境變數傳入，避免把輸入值直接展開在 shell 指令中
      VERIFY_SAMPLE_DATE: ${{ inputs.sample_date }}
      VERIFY_WINDOW_END: ${{ inputs.window_end }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝套件
        run: pip install -r requirements.txt
      - name: 單元測試
        run: pytest -q
      - name: API 實測
        run: python -m tools.verify_api --out verify_report
      - name: 上傳報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-api-report
          path: verify_report/
          retention-days: 14

  m4-dry-run:
    if: ${{ inputs.mode == 'm4_dry_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Taipei
      DRY_RUN_AS_OF: ${{ inputs.as_of_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝套件
        run: pip install -r requirements.txt
      - name: 單元測試
        run: pytest -q
      - name: M4 全量試跑
        run: python -m tools.dry_run_m4 --out dry_run_report
      - name: 上傳報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-dry-run-report
          path: dry_run_report/
          retention-days: 14
