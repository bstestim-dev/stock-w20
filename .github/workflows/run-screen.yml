# 林恩如週 20MA 選股系統：手動執行選股並部署 GitHub Pages（spec_v1 第 8.2 節；M6）。
# - 僅 workflow_dispatch，不含任何定期排程。
# - FINMIND_TOKEN 只由 GitHub Secrets 注入（選配；未設定即走免費官方路線）。
# - D5：以 actions/cache 保留 DayCache 日資料快取，抓取超時或失敗也照樣儲存；冷啟動可能需 1～3 次逐步補齊，
#   補齊前的執行以結束碼 3 結束、不更新 Pages。第 10.1 節 25 分鐘驗收以已有快取的執行為準。
# - M6-Q1＝B：成功時把日資料快取（公開官方行情）連同 manifest 放進 Pages 的 cache/；actions/cache 被移除
#   （超過 7 天未存取）時，改從已部署網站下載回來（SHA-256 核對）。不 commit 資料、不改權限。
name: run-screen

on:
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "基準日 YYYY-MM-DD（Asia/Taipei）；空白＝最新可用交易日"
        required: false
        default: ""
        type: string
      lookback_weeks:
        description: "歷史抓取週數；空白＝config.yaml（目前 60 週）"
        required: false
        default: ""
        type: string
      volume_spike_ratio:
        description: "爆量倍數門檻"
        required: false
        default: "1.5"
        type: string
      skip_fundamentals:
        description: "略過 EPS／營收／三大法人參考欄以加速執行"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      SW20_AS_OF_DATE: ${{ inputs.as_of_date }}
      SW20_LOOKBACK_WEEKS: ${{ inputs.lookback_weeks }}
      SW20_VOLUME_SPIKE_RATIO: ${{ inputs.volume_spike_ratio }}
      SW20_SKIP_FUNDAMENTALS: ${{ inputs.skip_fundamentals }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      DAYCACHE_DIR: .cache/daycache
      PAGES_CACHE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/cache/
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安裝套件
        run: pip install -r requirements.txt
      - name: 單元測試
        run: pytest -q
      - name: 還原日資料快取
        uses: actions/cache/restore@v5
        with:
          path: .cache/daycache
          key: daycache-${{ github.run_id }}
          restore-keys: |
            daycache-
      - name: 執行選股並產出 site/data
        timeout-minutes: 24
        run: >-
          python -m src.screener --out site/data --cache-dir "$DAYCACHE_DIR" --fetch-budget-min 16
          --restore-from "$PAGES_CACHE_URL" --publish-cache-dir site/cache
      - name: 儲存日資料快取（成功或失敗皆儲存）
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .cache/daycache
          key: daycache-${{ github.run_id }}
      - name: 上傳 Pages 產物
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
